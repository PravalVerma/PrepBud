[project]
name = "school-in-a-box-backend"
version = "0.1.0"
description = "School in a Box — AI adaptive learning platform (API)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "redis>=5.0",
    "tzdata>=2024.1",
    "celery[redis]>=5.4",
    "qdrant-client>=1.12",
    "boto3>=1.35",
    "pdfplumber>=0.11",
    "pytesseract>=0.3.13",
    "pillow>=10.4",
    "jinja2>=3.1",
    "kombu>=5.6,<5.7",
    "langgraph>=0.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "testcontainers[postgres,redis]>=4.8",
    "ruff>=0.6",
    "mypy>=1.11",
    "moto[s3]>=5.0",
    "fpdf2>=2.8",
    "boto3-stubs[s3]>=1.35",
    "celery-types>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "SIM", "RUF", "C4", "PT"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "RUF012", # SQLAlchemy __table_args__ / class-level config
    "RUF001", "RUF002", "RUF003",  # en-dashes and § in prose are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PT018"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Security"]

# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "pytesseract.*", "moto.*", "fpdf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: requires PostgreSQL + Redis (testcontainers or TEST_* URLs)",
]
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers.*",
    # In-memory Qdrant (tests) ignores payload indexes; the server honours them.
    "ignore:Payload indexes have no effect:UserWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
