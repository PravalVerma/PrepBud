# Local development dependencies for School in a Box.
# Start everything with:  docker compose up -d --wait
#
#   postgres  PostgreSQL 16            ${POSTGRES_PORT:-5432}
#   redis     Redis 7 (Celery broker)  ${REDIS_PORT:-6379}
#   qdrant    Qdrant vector store      ${QDRANT_PORT:-6333}
#   s3        SeaweedFS S3 gateway     ${S3_PORT:-8333}   (local stand-in for AWS S3 / R2)
services:
  postgres:
    image: postgres:16-alpine
    container_name: siab-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-siab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siab}
      POSTGRES_DB: ${POSTGRES_DB:-siab}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-siab} -d ${POSTGRES_DB:-siab}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: siab-redis
    # AOF persistence so queued Celery tasks survive restarts (ADR-010).
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: siab-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The image has no curl/wget; probe the HTTP port with bash's /dev/tcp.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage. Browsers upload straight to it with presigned URLs,
  # so CORS must allow the frontend origin. Credentials live in infra/seaweedfs/s3.json.
  s3:
    image: chrislusf/seaweedfs:4.48
    container_name: siab-s3
    command: >
      server -dir=/data -s3 -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
      -s3.allowedOrigins=${FRONTEND_ORIGINS:-http://localhost:3000,http://localhost:3100}
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - s3-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    # Healthy only once the uploads bucket exists — the check creates it if missing
    # (idempotent), so `docker compose up --wait` leaves a ready-to-use bucket.
    healthcheck:
      test:
        - CMD-SHELL
        - >
          echo "s3.bucket.list" | weed shell -master=127.0.0.1:9333 2>/dev/null
          | grep -q "${S3_BUCKET:-siab-uploads}" ||
          (echo "s3.bucket.create -name ${S3_BUCKET:-siab-uploads}" | weed shell -master=127.0.0.1:9333
          && echo "s3.bucket.list" | weed shell -master=127.0.0.1:9333 | grep -q "${S3_BUCKET:-siab-uploads}")
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 60s
      start_interval: 3s

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  s3-data:
