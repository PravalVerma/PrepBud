name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: siab
          POSTGRES_PASSWORD: siab
          POSTGRES_DB: siab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U siab -d siab_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://siab:siab@localhost:5432/siab_test
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - name: Tesseract (OCR tests run against the real binary)
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check (mypy --strict)
        run: uv run mypy app alembic/env.py
      - name: Tests (unit + integration) with coverage gate
        run: uv run pytest --cov --cov-report=term-missing:skip-covered --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend · lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Type check (tsc)
        run: npm run typecheck
      - name: Unit + component tests (vitest)
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: E2E · Playwright (full stack)
    # TEST_STRATEGY §4.3: E2E on merge to main (and on demand).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://siab:siab@localhost:5432/siab
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - name: Local infrastructure (PostgreSQL, Redis, Qdrant, S3)
        run: docker compose up -d --wait
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend deps + migrations
        working-directory: backend
        run: uv python install 3.12 && uv sync --locked && uv run alembic upgrade head
      - name: Frontend deps + build
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium && npm run build
      - name: Playwright
        working-directory: frontend
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=200
